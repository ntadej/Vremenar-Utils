[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vremenar_utils"
description = ""
dynamic = ["version"]
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Tadej Novak", email = "tadej@tano.si" }]
requires-python = ">= 3.11"
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "Babel >= 2.13",
  "firebase-admin == 7.5.*",
  "geopandas == 1.1.*",
  "httpx2 ==2.10.*",
  "lxml",
  "parsel",
  "python-crontab == 3.3.*",
  "pyyaml",
  "redis[hiredis] == 8.1.*",
  "rich == 15.0.*",
  "Shapely",
  "typer == 0.27.*",
  "wheel",
  "xmltodict",
]

[dependency-groups]
dev = [
  "coverage[toml]",
  "gevent",
  "mypy == 2.3.1",
  "pre-commit",
  "pre-commit-hooks == 6.0.*",
  "pytest >= 8.0",
  "pytest-cov",
  "pytest-forked == 1.6.*",
  "ruff == 0.16.3",
  "ty == 0.0.72",
  "types-python-crontab",
  "types-python-dateutil",
  "types-pyyaml",
  "types-redis",
]

[project.scripts]
vremenar_utils = "vremenar_utils.cli:application"

[tool.hatch.version]
path = "src/vremenar_utils/__init__.py"

[tool.coverage.run]
branch = true
source = ["src/vremenar_utils"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if self.debug:",
  "if debug:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "__repr__",
]
ignore_errors = true
omit = ["src/vremenar_utils/tests/*", "tests/*"]

[tool.ruff]
src = ["src"]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
preview = true
select = [
  # "ERA",   # eradicate
  "YTT",   # flake8-2020
  "ANN",   # flake8-annotations
  "ASYNC", # flake8-async
  "S",     # flakey-bandit
  "BLE",   # flake8-blind-except
  "FBT",   # flake8-boolean-trap
  "B",     # flake8-bugbear
  "A",     # flake8-builtins
  "COM",   # flake8-commas
  "C4",    # flake8-comprehensions
  "DTZ",   # flake8-datetimez
  "T10",   # flake8-debugger
  "EM",    # flake8-errmsg
  "EXE",   # flake8-executable
  "FIX",   # flake8-fixme
  "FA",    # flake8-future-annotations
  "ISC",   # flake8-implicit-str-concat
  "ICN",   # flake8-import-conventions
  "LOG",   # flake8-logging
  "G",     # flake8-logging-format
  "INP",   # flake8-no-pep420
  "PIE",   # flake8-pie
  "T20",   # flake8-print
  "PT",    # flake8-pytest-style
  "Q",     # flake8-quotes
  "RSE",   # flake8-raise
  "RET",   # flake8-return
  "SLF",   # flake8-self
  "SIM",   # flake8-simplify
  "SLOT",  # flake8-slots
  "TID",   # flake8-tidy-imports
  "TD",    # flake8-todos
  "TC",    # flake8-type-checking
  "ARG",   # flake8-unused-arguments
  "PTH",   # flake8-use-pathlib
  "FLY",   # flynt
  "I",     # isort
  "C90",   # mccabe (complexity)
  "NPY",   # numpy
  "PD",    # pandas-vet
  "N",     # pep8-naming
  "PERF",  # perflint
  "E",     # pycodestyle
  "W",     # pycodestyle
  # "DOC",   # pydoclint
  "D",    # pydocstyle
  "F",    # pyflakes
  "PGH",  # pygrep-hooks
  "PL",   # pylint
  "UP",   # pyupgrade
  "FURB", # refurb
  "RUF",  # ruff
  "TRY",  # tryceratops
]
ignore = [
  "incorrect-blank-line-before-class", # conflicting with no-blank-line-before-class
  "magic-value-comparison",            # not wanted
  "multi-line-summary-second-line",    # conflicting with multi-line-summary-first-line
  "non-empty-init-module",             # not wanted
]

[tool.ruff.lint.per-file-ignores]
"src/vremenar_utils/cli/__init__.py" = [
  "boolean-type-hint-positional-argument",
  "boolean-default-value-positional-argument",
  "import-outside-top-level",
]
"**/tests/*" = ["assert", "import-outside-top-level", "print"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.rules]
all = "error"
invalid-method-override = "ignore"
missing-override-decorator = "ignore"
unused-type-ignore-comment = "ignore"

[tool.mypy]
strict = true
pretty = true
show_column_numbers = true
show_error_codes = true
show_error_context = true
warn_unreachable = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--cov=vremenar_utils --cov-config=.coveragerc --cov-report=term-missing:skip-covered --cov-report xml --cov-report html:coverage --junitxml=junit.xml -o junit_family=legacy"
testpaths = ["tests"]
